# Planet X: sirve web/dist y proxea /api a la API (mismo origen; el visor usa rutas relativas /api).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DNS interno de Docker: «api» se resuelve en cada petición, así nginx arranca aunque la API
    # aún no exista y sigue funcionando si la API se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Hasta 10 MB de PDF codificado dentro de una ficha compartida.
        client_max_body_size 14m;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        # La ruta en vivo tarda hasta 25 s; CloudFront corta a los 30 s. Se mantiene por debajo.
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # El HTML nunca se cachea para ver siempre el último build.
    location = /index.html {
        expires -1;
    }

    # Aplicación de una sola página.
    location / {
        try_files $uri /index.html;
    }
}
