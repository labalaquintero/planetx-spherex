# Integración continua (CI). Solo comprueba: sin despliegue, sin secretos y sin red de IRSA.
# Ningún job necesita data/ (no está en Git); Docker solo construye las imágenes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      # Un error de importación (p. ej. falta Pillow o reproject) hace fallar la recolección: no se salta en silencio.
      # tests/science importa «api.planetx.science», así que la raíz del repo debe estar en PYTHONPATH
      # (api/pytest.ini solo añade api/).
      - name: Pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  web:
    name: web (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # pnpm sale del campo packageManager de web/package.json.
      - name: Activar pnpm (corepack)
        run: corepack enable
      - name: Ruta del almacén de pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-web-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-web-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # build = tsc -b && vite build (incluye la comprobación de tipos).
      - run: pnpm build

  docker-build:
    name: docker (solo build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Construye las imágenes de compose.yaml sin levantar el stack (los datos no están en Git).
      - name: Build de las imágenes
        uses: docker/bake-action@v6
        with:
          files: compose.yaml
          load: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  explorar:
    name: explorar (condicional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experimental/explorar
    # hashFiles no existe a nivel de job: la condición va en cada paso.
    steps:
      - uses: actions/checkout@v5
      - name: Aviso si no existe
        if: ${{ hashFiles('experimental/explorar/package.json') == '' }}
        working-directory: .
        run: echo "experimental/explorar no existe en esta rama, job omitido."
      - uses: actions/setup-node@v5
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        with:
          node-version: "24"
      - name: Activar pnpm (corepack)
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        run: corepack enable
      - name: Ruta del almacén de pnpm
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-explorar-${{ runner.os }}-${{ hashFiles('experimental/explorar/pnpm-lock.yaml') }}
          restore-keys: pnpm-explorar-${{ runner.os }}-
      - name: Instalar
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        run: pnpm install --frozen-lockfile
      - name: Comprobación de tipos
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        run: pnpm run --if-present typecheck
      - name: Pruebas
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        run: pnpm test
      - name: Build
        if: ${{ hashFiles('experimental/explorar/package.json') != '' }}
        run: pnpm build

  role-paths:
    name: role-paths (informativo)
    # Informativo: con rutas nuevas (p. ej. este workflow) el mapa de la base aún no las conoce y puede
    # dar BLOQUEADO. No debe bloquear el PR.
    continue-on-error: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # El dueño sale del prefijo de la rama (isaac/ci → isaac); sin prefijo válido se omite.
      - name: Comprobar rutas por dueño
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          owner="${HEAD_REF%%/*}"
          if ! grep -qF "\"$owner\": [" tools/check_role_paths.py; then
            echo "::notice::La rama '$HEAD_REF' no empieza por un dueño conocido: chequeo omitido."
            exit 0
          fi
          python tools/check_role_paths.py --owner "$owner" --base origin/main --ci --map-ref origin/main
