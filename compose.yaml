# Despliegue LOCAL con Docker: «docker compose up --build» y abrir http://localhost (ver README).
# No es un despliegue a AWS ni a producción.
name: planetx

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: planetx-api:local
    restart: unless-stopped
    environment:
      # Caso preparado y PNG, bajo ./data montado en solo lectura. Rutas explícitas y absolutas.
      PLANETX_CATALOG_MANIFEST: ${PLANETX_CATALOG_MANIFEST:-/data/wise0855/manifest.json}
      PLANETX_PRODUCTS_DIR: ${PLANETX_PRODUCTS_DIR:-/data/wise0855/products}
      PLANETX_ENABLE_LIVE: ${PLANETX_ENABLE_LIVE:-0}
      PLANETX_LIVE_CONCURRENCY: ${PLANETX_LIVE_CONCURRENCY:-2}
    volumes:
      - ./data:/data:ro
    # Sin puertos publicados: solo web (nginx) llega a la API, por la red interna.
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    image: planetx-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Por defecto solo en loopback; WEB_BIND=0.0.0.0 para abrirlo a la red local.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
