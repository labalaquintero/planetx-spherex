# Override SOLO para producción (EC2 de la demo): Caddy delante de web con HTTPS para balax.me.
# En la instancia se activa con esta línea en su .env (así «docker compose up -d --build» no cambia):
#   COMPOSE_FILE=compose.yaml:compose.prod.yaml
# En local no se usa: «docker compose up --build» sigue leyendo solo compose.yaml. Ver infra/README.md.

services:
  api:
    environment:
      PLANETX_WORKSPACE_SECURE_COOKIES: "1"

  web:
    # Caddy ocupa 80 y 443 del host; web solo se alcanza por la red interna de Compose.
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (opcional: si el grupo de seguridad no abre UDP, el navegador usa TCP)
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Estado y certificados persistentes: sin ellos, cada reinicio pediría certificados nuevos y
      # Let's Encrypt limita cuántos se emiten por semana.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
